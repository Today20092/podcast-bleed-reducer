name: Update published download links

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: readme-downloads
  cancel-in-progress: false

jobs:
  downloads:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Refresh platform downloads
        shell: pwsh
        run: ./scripts/update-downloads.ps1
      - name: Propose download links and run native checks
        shell: bash
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          branch="codex/published-downloads-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: update published application downloads'
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title 'docs: update published application downloads' --body 'Refreshes the download table from published release assets. Native checks are explicitly dispatched for this automation-created pull request.'
          gh workflow run pr-checks.yml --ref "$branch"

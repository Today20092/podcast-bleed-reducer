name: Portable Windows draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft version tag to rebuild
        required: true
        default: v0.1.0-alpha.1

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Compiler installation failed' }
          rustup override set 1.99.0
          if ($LASTEXITCODE -ne 0) { throw 'Compiler selection failed' }
      - uses: actions/cache/restore@v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/ort.pyke.io
            target
          key: windows-2025-rust-1.99.0-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: windows-2025-rust-1.99.0-${{ hashFiles('Cargo.lock') }}-
      - name: Restore native build inputs
        if: steps.rust-cache.outputs.cache-matched-key != ''
        run: |
          # Re-run ort's build script when adopting a cache without its native files.
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'ort.pyke.io'))) {
            cargo clean --package ort-sys
            if ($LASTEXITCODE -ne 0) { throw 'Native build cache reset failed' }
          }
      - name: Check and test
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo test --all-targets --locked -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Report Windows application faults
        if: failure()
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001; StartTime = (Get-Date).AddHours(-1) } -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { $_.Message }
      - name: Trim build cache
        if: always()
        run: |
          Get-ChildItem -LiteralPath target -Recurse -File -Filter '*.pdb' -ErrorAction SilentlyContinue | Remove-Item -Force
      - name: Build and verify portable ZIP
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          ./scripts/package.ps1 -Version $version
      - name: Prepare draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.TrimStart('v')
          $assets = @("dist/CleanSlate-$version-windows-x64.zip", "dist/CleanSlate-$version-windows-x64.zip.sha256")
          $existing = gh release view $tag --json isDraft,isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) { throw 'Refusing to replace a published release' }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --verify-tag --draft --prerelease --title "CleanSlate $tag" --notes-file docs/alpha-release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }
      - uses: actions/cache/save@v5
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/ort.pyke.io
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

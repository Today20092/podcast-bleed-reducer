name: Desktop draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to build
        required: true
        default: v0.1.0-alpha.8
      build_only:
        description: Check the selected branch without creating or updating a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_only && github.ref || inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Validate version
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$') { throw 'Invalid version tag' }
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libssl-dev pkg-config patchelf desktop-file-utils libfuse2
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Compiler installation failed' }
          rustup override set 1.99.0
          if ($LASTEXITCODE -ne 0) { throw 'Compiler selection failed' }
      - uses: actions/cache/restore@v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/ort.pyke.io
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            target
          key: ${{ matrix.runner }}-${{ matrix.platform }}-rust-1.99.0-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: ${{ matrix.runner }}-${{ matrix.platform }}-rust-1.99.0-${{ hashFiles('Cargo.lock') }}-
      - name: Restore native build inputs
        if: steps.rust-cache.outputs.cache-matched-key != ''
        run: |
          # Rerun ort's build script when adopting a cache without its native files.
          $nativeCache = if ($IsWindows) { Join-Path $env:LOCALAPPDATA 'ort.pyke.io' } elseif ($IsMacOS) { Join-Path $env:HOME 'Library/Caches/ort.pyke.io' } else { Join-Path $env:HOME '.cache/ort.pyke.io' }
          if (-not (Test-Path -LiteralPath $nativeCache)) {
            cargo clean --package ort-sys
            if ($LASTEXITCODE -ne 0) { throw 'Native build cache reset failed' }
          }
      - name: Check and test
        run: ./scripts/check.ps1
      - name: Report Windows application faults
        if: failure() && runner.os == 'Windows'
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001; StartTime = (Get-Date).AddHours(-1) } -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { $_.Message }
      - name: Build and verify application package
        run: ./scripts/package.ps1 -Version $env:RELEASE_TAG.Substring(1)
      - name: Save checked package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error
      - name: Trim Windows build cache
        if: always() && runner.os == 'Windows'
        run: |
          Get-ChildItem -LiteralPath target -Recurse -File -Filter '*.pdb' -ErrorAction SilentlyContinue | Remove-Item -Force
      - uses: actions/cache/save@v5
        if: always() && steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/ort.pyke.io
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  release:
    name: Prepare one draft with all desktop packages
    needs: package
    if: github.event_name == 'push' || !inputs.build_only
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Prepare draft prerelease
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.Substring(1)
          $assets = @()
          foreach ($item in @('windows-x64.zip', 'macos-arm64.dmg', 'macos-x64.dmg', 'linux-x64.AppImage')) {
            $asset = "release-assets/CleanSlate-$version-$item"
            if (-not (Test-Path -LiteralPath $asset) -or -not (Test-Path -LiteralPath "$asset.sha256")) { throw "Missing checked asset: $asset" }
            $assets += @($asset, "$asset.sha256")
          }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to replace a published release' }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --verify-tag --draft --prerelease --title "CleanSlate $tag" --notes-file docs/alpha-release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }

[package]
name = "rust-app"
version = "1.0.0"
license = "MIT"
edition = "2024"

[dependencies]
bwavfile = "2.0.1"
iced = { version = "0.14.0", features = ["advanced", "canvas", "svg", "sysinfo", "tokio"] }
ort = "=2.0.0-rc.10"
rfd = "0.17.2"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
nalgebra = { version = "=0.35.0", default-features = false, features = ["std"] }
linfa = { version = "=0.8.1", default-features = false }
linfa-logistic = "=0.8.1"
ndarray = "=0.16.1"
rubato = "=0.16.2"
symphonia = { version = "=0.6.1", default-features = false, features = ["aiff", "wav", "pcm", "flac", "mp3", "isomp4", "aac", "alac", "ogg", "vorbis"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
iced_tiny_skia = "=0.14.0"

[[example]]
name = "pan-drawing-probe"
path = ".scratch/offline-supervised-editor/pan-drawing-probe.rs"

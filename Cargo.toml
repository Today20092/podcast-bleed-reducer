[package]
name = "rust-app"
version = "1.1.0"
license = "MIT"
edition = "2024"

[features]
default = ["desktop-ui"]
desktop-ui = []
updater-test-key = []

[[bin]]
name = "rust-app"
path = "src/main.rs"
required-features = ["desktop-ui"]

[dependencies]
bwavfile = "2.0.1"
iced = { version = "0.14.0", features = ["advanced", "canvas", "svg", "sysinfo", "tokio"] }
ort = "=2.0.0-rc.10"
rfd = "0.17.2"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
semver = "=1.0.28"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
minisign-verify = "=0.3.0"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
getrandom = "0.3"

nalgebra = { version = "=0.35.0", default-features = false, features = ["std"] }
cleanslate-ownership-model = { path = "crates/ownership-model" }
rubato = "=0.16.2"
symphonia = { version = "=0.6.1", default-features = false, features = ["aiff", "wav", "pcm", "flac", "mp3", "isomp4", "aac", "alac", "ogg", "vorbis"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
iced_tiny_skia = "=0.14.0"

[[example]]
name = "pan-drawing-probe"
path = ".scratch/offline-supervised-editor/pan-drawing-probe.rs"

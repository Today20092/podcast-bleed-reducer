# One local profile for GUI builds and checks; keep dependencies small.
[profile.dev]
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.rust-app]
opt-level = 1
debug = 0
codegen-units = 256

[profile.test.package.rust-app]
opt-level = 1
debug = 0
codegen-units = 256

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.digest]
opt-level = 2

# Continuous scrolling rebuilds paths every frame; optimize both renderer paths.
[profile.dev.package.lyon_tessellation]
opt-level = 2

[profile.dev.package.lyon_path]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.tiny-skia-path]
opt-level = 2

[profile.dev.package.iced_tiny_skia]
opt-level = 2

[profile.dev.package.iced_graphics]
opt-level = 2

[profile.dev.package.bwavfile]
opt-level = 2

[profile.dev.package.ort]
opt-level = 2

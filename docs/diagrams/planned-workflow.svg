<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="planned-workflow-title planned-workflow-desc" id="planned-workflow-root">
<title id="planned-workflow-title">The confirmed editing workflow</title>
<desc id="planned-workflow-desc">Historical proposal: Open tracks leads to Listen in Original; Listen in Original leads to Drag and label a few clear examples; Drag and label a few clear examples leads to Click Analyze; Click Analyze leads to Listen in Processed and Removed; Listen in Processed and Removed leads to Adjust attenuation and fades; Adjust attenuation and fades leads to Export processed tracks.</desc>

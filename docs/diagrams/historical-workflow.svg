<title id="historical-workflow-title">The proposed review and correction loop</title>
<desc id="historical-workflow-desc">Historical proposal: Open or import tracks leads to See timing status and listen in Original; See timing status and listen in Original leads to Drag and label solo examples and room tone; Drag and label solo examples and room tone leads to Analyze; Analyze leads to Compare Original, Processed and Removed; Compare Original, Processed and Removed leads to Correct labels or edit gain; Correct labels or edit gain leads to Save project and export; Correct labels or edit gain leads to Analyze (Labels changed).</desc>

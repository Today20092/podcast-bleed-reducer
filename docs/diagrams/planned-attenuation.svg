<title id="planned-attenuation-title">The proposed supervised attenuation policy</title>
<desc id="planned-attenuation-desc">Historical proposal: Your solo, overlap and room-tone examples leads to Learn each speaker's direct sound, bleed and background; Measure sound on every microphone leads to Learn each speaker's direct sound, bleed and background; Learn each speaker's direct sound, bleed and background leads to Estimate whether each track's own speaker is talking; Optional Nemotron speaker-activity evidence leads to Estimate whether each track's own speaker is talking; Estimate whether each track's own speaker is talking leads to For each track and time interval; For each track and time interval leads to Keep original level (Own speaker talking); For each track and time interval leads to Reduce by your attenuation setting (Own speaker absent); Keep original level leads to Add smooth fades and apply manual gain edits; Reduce by your attenuation setting leads to Add smooth fades and apply manual gain edits; Add smooth fades and apply manual gain edits leads to Play or export original audio through these gain curves.</desc>

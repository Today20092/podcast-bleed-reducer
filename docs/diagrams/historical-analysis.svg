<title id="historical-analysis-title">The original supervised editor proposal</title>
<desc id="historical-analysis-desc">Historical proposal: Original synchronized mono tracks leads to Validate sources and shared timing; Validate sources and shared timing leads to Cached 16 kHz analysis audio; Validate sources and shared timing leads to Cached display waveforms; Cached 16 kHz analysis audio leads to Nemotron speaker activity; Cached 16 kHz analysis audio leads to Per-track speech and acoustic measurements; Human solo, overlap and room-tone labels leads to Map anonymous voices to assigned speakers; Nemotron speaker activity leads to Map anonymous voices to assigned speakers; Human solo, overlap and room-tone labels leads to Learn noise floors and directed bleed relationships; Per-track speech and acoustic measurements leads to Learn noise floors and directed bleed relationships; Map anonymous voices to assigned speakers leads to Train an independent ownership classifier per track; Learn noise floors and directed bleed relationships leads to Train an independent ownership classifier per track; Human solo, overlap and room-tone labels leads to Train an independent ownership classifier per track; Train an independent ownership classifier per track leads to Estimate whether each track's own speaker is talking; Estimate whether each track's own speaker is talking leads to Choose continuous regions with human-label constraints; Choose continuous regions with human-label constraints leads to Own speech or overlap: preserve; Choose continuous regions with human-label constraints leads to Supported bleed or no speech: attenuate; Choose continuous regions with human-label constraints leads to Missing or conflicting evidence: preserve and flag for review; Own speech or overlap: preserve leads to Automatic gain envelopes with padding and finite fades; Supported bleed or no speech: attenuate leads to Automatic gain envelopes with padding and finite fades; Missing or conflicting evidence: preserve and flag for review leads to Automatic gain envelopes with padding and finite fades; Automatic gain envelopes with padding and finite fades leads to Compose protected manual gain edits; Compose protected manual gain edits leads to One effective envelope for display, audition and export; Validate sources and shared timing leads to Original native-rate samples; Original native-rate samples leads to One effective envelope for display, audition and export.</desc>

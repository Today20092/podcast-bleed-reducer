[package]
name = "cleanslate-fl-probe"
version = "0.0.6"
edition = "2024"
license = "MIT"
publish = false
build = "product-build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

# Keep the experimental host adapter out of the desktop application's dependency graph.
[workspace]

[dependencies]
nice-plug = { version = "=0.4.2", default-features = false, features = ["vst3", "editor", "assert_process_allocs"] }
crossbeam = "=0.8.4"
cleanslate-ownership-model = { path = "../../crates/ownership-model" }
rust-app = { path = "../..", default-features = false }
nice-plug-egui = "=0.6.0"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
parking_lot = "=0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
clap-sys = "=0.5.0"
libloading = "=0.8.9"
vst3 = "=0.3.0"

[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package.rust-app]
codegen-units = 16

